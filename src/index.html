<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="google" content="notranslate">
    <title>Family Chalkboard</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --gold: #d7a45c;
        --gold-soft: #f0c986;
        --ink: #f5f1ea;
        --muted: #b9aa9a;
        --surface: rgba(23, 21, 19, .94);
        --surface-raised: rgba(35, 31, 27, .96);
        --border: rgba(215, 164, 92, .28);
        background: #08090a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 80% 0%, rgba(183, 119, 47, .13), transparent 32%),
          linear-gradient(145deg, #11100f, #050607 68%);
        color: var(--ink);
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        width: 100%;
        height: 100dvh;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 14px;
        padding: 18px;
      }

      .topbar,
      .note-card,
      .board-shell {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(31, 28, 25, .94), rgba(10, 11, 13, .97));
        box-shadow:
          0 18px 44px rgba(0, 0, 0, .38),
          inset 0 1px 0 rgba(255, 234, 199, .06);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 20px;
      }

      .title-group {
        min-width: 0;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.45rem, 3.4vw, 2.2rem);
        letter-spacing: -.035em;
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: clamp(.85rem, 2vw, 1rem);
      }

      .save-status {
        flex: 0 0 auto;
        min-width: 92px;
        padding: 9px 13px;
        border: 1px solid rgba(215, 164, 92, .22);
        border-radius: 999px;
        color: var(--gold-soft);
        background: rgba(215, 164, 92, .09);
        font-size: .84rem;
        font-weight: 750;
        text-align: center;
      }

      .save-status[data-state="error"] {
        color: #ffb0a9;
        border-color: rgba(255, 121, 110, .3);
        background: rgba(255, 121, 110, .1);
      }

      .note-card {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
      }

      .note-label {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 17px;
        color: #17120c;
        background: linear-gradient(145deg, var(--gold-soft), var(--gold));
        box-shadow: 0 8px 24px rgba(183, 119, 47, .24);
        font-size: 1.5rem;
        font-weight: 900;
      }

      textarea {
        width: 100%;
        min-height: 58px;
        max-height: 112px;
        resize: none;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font-size: clamp(1rem, 2.4vw, 1.25rem);
        line-height: 1.42;
      }

      textarea::placeholder {
        color: #8d8176;
      }

      .board-shell {
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 78px;
        padding: 12px 14px;
        overflow-x: auto;
        scrollbar-width: none;
        border-bottom: 1px solid rgba(215, 164, 92, .18);
        background: rgba(13, 13, 13, .76);
      }

      .toolbar::-webkit-scrollbar {
        display: none;
      }

      .tool-button,
      .color-button,
      .size-button {
        flex: 0 0 auto;
        min-width: 54px;
        min-height: 54px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 17px;
        color: var(--ink);
        background: rgba(255, 255, 255, .055);
        font-weight: 760;
      }

      .tool-button {
        padding: 0 15px;
      }

      .tool-button:active,
      .color-button:active,
      .size-button:active {
        transform: translateY(1px);
      }

      .tool-button[aria-pressed="true"],
      .size-button[aria-pressed="true"] {
        color: #17120c;
        border-color: var(--gold);
        background: linear-gradient(145deg, var(--gold-soft), var(--gold));
      }

      .tool-button.danger {
        color: #ffc0ba;
        border-color: rgba(255, 121, 110, .22);
      }

      .separator {
        flex: 0 0 1px;
        width: 1px;
        height: 42px;
        margin: 0 2px;
        background: rgba(255, 255, 255, .12);
      }

      .color-button {
        position: relative;
        width: 54px;
        padding: 0;
      }

      .color-button::before {
        content: "";
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: var(--chalk-color);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, .08);
      }

      .color-button[aria-pressed="true"] {
        border-color: var(--gold);
        box-shadow: inset 0 0 0 2px rgba(215, 164, 92, .24);
      }

      .size-button {
        width: 54px;
        padding: 0;
      }

      .size-dot {
        width: var(--dot-size);
        height: var(--dot-size);
        border-radius: 50%;
        background: currentColor;
      }

      .canvas-wrap {
        position: relative;
        min-height: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgba(215, 164, 92, .055), transparent 68%),
          #090c0b;
      }

      .drawing-surface {
        position: absolute;
        inset: 0;
        overflow: hidden;
        outline: 1px solid rgba(215, 164, 92, .12);
        outline-offset: -1px;
        border-radius: 16px;
        background:
          radial-gradient(circle at 18% 20%, rgba(255, 255, 255, .026) 0 1px, transparent 2px),
          radial-gradient(circle at 74% 63%, rgba(255, 255, 255, .02) 0 1px, transparent 2px),
          linear-gradient(120deg, rgba(255, 255, 255, .012), transparent 35%),
          #15211d;
        background-size: 31px 29px, 37px 41px, auto, auto;
        box-shadow:
          0 12px 42px rgba(0, 0, 0, .34),
          inset 0 0 72px rgba(0, 0, 0, .42);
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }

      .empty-hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        color: rgba(235, 240, 231, .42);
        font-size: clamp(1.05rem, 3vw, 1.45rem);
        font-weight: 650;
        text-align: center;
        pointer-events: none;
        transition: opacity .2s ease;
      }

      .empty-hint[hidden] {
        opacity: 0;
      }

      dialog {
        width: min(88vw, 440px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 0;
        color: var(--ink);
        background: linear-gradient(145deg, #26211d, #0d0e10);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .7);
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, .72);
        backdrop-filter: blur(4px);
      }

      .dialog-content {
        padding: 24px;
      }

      .dialog-content h2 {
        margin: 0 0 8px;
        font-size: 1.45rem;
      }

      .dialog-content p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .dialog-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 0 24px 24px;
      }

      .dialog-actions button {
        min-height: 54px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 17px;
        color: var(--ink);
        background: rgba(255, 255, 255, .06);
        font-weight: 780;
      }

      .dialog-actions .confirm {
        color: #1b0c09;
        border-color: #ff8b80;
        background: #ff8b80;
      }

      @media (max-width: 620px) {
        .app {
          gap: 10px;
          padding: 10px;
        }

        .topbar {
          padding: 14px;
          border-radius: 20px;
        }

        .subtitle {
          display: none;
        }

        .note-card {
          padding: 10px 13px;
          border-radius: 20px;
        }

        .note-label {
          width: 44px;
          height: 44px;
          border-radius: 14px;
        }

        .toolbar {
          min-height: 68px;
          padding: 8px 10px;
        }

        .tool-button,
        .color-button,
        .size-button {
          min-width: 50px;
          min-height: 50px;
          border-radius: 15px;
        }
      }

      @media (max-height: 700px) {
        .app {
          gap: 8px;
          padding: 8px;
        }

        .topbar,
        .note-card {
          padding: 9px 12px;
          border-radius: 18px;
        }

        .subtitle {
          display: none;
        }

        .note-label {
          width: 40px;
          height: 40px;
          border-radius: 13px;
        }

        textarea {
          min-height: 44px;
        }

        .toolbar {
          min-height: 58px;
          padding: 5px 8px;
        }

        .tool-button,
        .color-button,
        .size-button {
          min-width: 46px;
          min-height: 46px;
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title-group">
          <h1 data-i18n="title">Family Chalkboard</h1>
          <p class="subtitle" data-i18n="subtitle">Write or draw – everything saves automatically</p>
        </div>
        <div class="save-status" id="save-status" role="status" aria-live="polite">
          Loading…
        </div>
      </header>

      <section class="note-card" id="note-card" aria-label="Family note">
        <div class="note-label" aria-hidden="true">Aa</div>
        <textarea
          id="family-note"
          maxlength="1000"
          rows="2"
          aria-label="Family note"
          placeholder="Leave a small note for the family…"
        ></textarea>
      </section>

      <section class="board-shell" id="board-shell" aria-label="Drawing area">
        <nav class="toolbar" id="toolbar" aria-label="Drawing tools">
          <button class="tool-button" id="pen-tool" type="button" aria-pressed="true">
            Chalk
          </button>
          <button class="tool-button" id="eraser-tool" type="button" aria-pressed="false">
            Eraser
          </button>

          <span class="separator" aria-hidden="true"></span>

          <button class="color-button" type="button" data-color="#f3f1e8" data-label="white" style="--chalk-color:#f3f1e8" aria-label="White chalk" aria-pressed="true"></button>
          <button class="color-button" type="button" data-color="#f5cf68" data-label="yellow" style="--chalk-color:#f5cf68" aria-label="Yellow chalk" aria-pressed="false"></button>
          <button class="color-button" type="button" data-color="#f29ab2" data-label="pink" style="--chalk-color:#f29ab2" aria-label="Pink chalk" aria-pressed="false"></button>
          <button class="color-button" type="button" data-color="#82c7ef" data-label="blue" style="--chalk-color:#82c7ef" aria-label="Blue chalk" aria-pressed="false"></button>
          <button class="color-button" type="button" data-color="#9fd69b" data-label="green" style="--chalk-color:#9fd69b" aria-label="Green chalk" aria-pressed="false"></button>

          <span class="separator" aria-hidden="true"></span>

          <button class="size-button" type="button" data-size="4" data-label="thin" aria-label="Thin chalk" aria-pressed="false">
            <span class="size-dot" style="--dot-size:6px"></span>
          </button>
          <button class="size-button" type="button" data-size="8" data-label="medium" aria-label="Medium chalk" aria-pressed="true">
            <span class="size-dot" style="--dot-size:11px"></span>
          </button>
          <button class="size-button" type="button" data-size="15" data-label="thick" aria-label="Thick chalk" aria-pressed="false">
            <span class="size-dot" style="--dot-size:18px"></span>
          </button>

          <span class="separator" aria-hidden="true"></span>

          <button class="tool-button" id="undo-button" type="button" aria-label="Undo the latest stroke">
            Undo
          </button>
          <button class="tool-button" id="view-mode-button" type="button" aria-pressed="true">
            Fit
          </button>
          <button class="tool-button danger" id="clear-button" type="button">
            Clear
          </button>
        </nav>

        <div class="canvas-wrap" id="canvas-wrap">
          <div class="drawing-surface" id="drawing-surface">
            <canvas id="chalkboard" aria-label="Draw here with your finger"></canvas>
            <div class="empty-hint" id="empty-hint">
              Draw here with your finger ✦
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="clear-dialog">
      <div class="dialog-content">
        <h2 id="clear-title">Clear the whole board?</h2>
        <p id="clear-description">Both the drawing and the family note will be removed.</p>
      </div>
      <div class="dialog-actions">
        <button id="cancel-clear" type="button">Cancel</button>
        <button class="confirm" id="confirm-clear" type="button">Yes, clear</button>
      </div>
    </dialog>

    <script>
      const canvas = document.getElementById("chalkboard");
      const canvasWrap = document.getElementById("canvas-wrap");
      const drawingSurface = document.getElementById("drawing-surface");
      const context = canvas.getContext("2d");
      const note = document.getElementById("family-note");
      const status = document.getElementById("save-status");
      const emptyHint = document.getElementById("empty-hint");
      const penTool = document.getElementById("pen-tool");
      const eraserTool = document.getElementById("eraser-tool");
      const undoButton = document.getElementById("undo-button");
      const viewModeButton = document.getElementById("view-mode-button");
      const clearButton = document.getElementById("clear-button");
      const clearDialog = document.getElementById("clear-dialog");
      const cancelClear = document.getElementById("cancel-clear");
      const confirmClear = document.getElementById("confirm-clear");
      const colorButtons = [...document.querySelectorAll(".color-button")];
      const sizeButtons = [...document.querySelectorAll(".size-button")];

      const translations = {
        en: {
          pageTitle: "Family Chalkboard",
          title: "Family Chalkboard",
          subtitle: "Write or draw – everything saves automatically",
          loading: "Loading…",
          saving: "Saving…",
          saved: "Saved",
          saveError: "Could not save",
          loadError: "Could not load",
          noteLabel: "Family note",
          notePlaceholder: "Leave a small note for the family…",
          drawingArea: "Drawing area",
          drawingTools: "Drawing tools",
          chalk: "Chalk",
          eraser: "Eraser",
          undo: "Undo",
          undoLabel: "Undo the latest stroke",
          viewFit: "Fit",
          viewFill: "Fill",
          viewFitLabel: "View mode: fit the drawing without distortion",
          viewFillLabel: "View mode: fill the drawing area; proportions may change",
          clear: "Clear",
          empty: "Draw here with your finger ✦",
          canvasLabel: "Draw here with your finger",
          clearTitle: "Clear the whole board?",
          clearDescription: "Both the drawing and the family note will be removed.",
          cancel: "Cancel",
          confirm: "Yes, clear",
          colors: {
            white: "White chalk",
            yellow: "Yellow chalk",
            pink: "Pink chalk",
            blue: "Blue chalk",
            green: "Green chalk",
          },
          sizes: {
            thin: "Thin chalk",
            medium: "Medium chalk",
            thick: "Thick chalk",
          },
        },
        sv: {
          pageTitle: "Griffeltavlan",
          title: "Griffeltavlan",
          subtitle: "Skriv eller rita – allt sparas automatiskt",
          loading: "Laddar…",
          saving: "Sparar…",
          saved: "Sparad",
          saveError: "Kunde inte spara",
          loadError: "Kunde inte ladda",
          noteLabel: "Familjens notering",
          notePlaceholder: "Skriv en liten notering till familjen…",
          drawingArea: "Rityta",
          drawingTools: "Ritverktyg",
          chalk: "Krita",
          eraser: "Sudd",
          undo: "Ångra",
          undoLabel: "Ångra senaste strecket",
          viewFit: "Passa in",
          viewFill: "Fyll ytan",
          viewFitLabel: "Visning: passa in teckningen utan förvrängning",
          viewFillLabel: "Visning: fyll ritytan; proportionerna kan ändras",
          clear: "Töm",
          empty: "Rita med fingret här ✦",
          canvasLabel: "Rita med fingret här",
          clearTitle: "Töm hela tavlan?",
          clearDescription: "Både teckningen och familjens notering tas bort.",
          cancel: "Avbryt",
          confirm: "Ja, töm",
          colors: {
            white: "Vit krita",
            yellow: "Gul krita",
            pink: "Rosa krita",
            blue: "Blå krita",
            green: "Grön krita",
          },
          sizes: {
            thin: "Tunn krita",
            medium: "Mellanstor krita",
            thick: "Tjock krita",
          },
        },
      };

      const languageParameter = new URLSearchParams(window.location.search).get("lang");
      const language = languageParameter === "sv" || languageParameter === "en"
        ? languageParameter
        : (navigator.language || "en").toLowerCase().startsWith("sv") ? "sv" : "en";
      const copy = translations[language];

      const viewModeStorageKey = "family-chalkboard:view-mode";
      const minCanvasAspectRatio = 0.1;
      const maxCanvasAspectRatio = 10;
      let board = {
        version: 2,
        note: "",
        canvas: { aspectRatio: null },
        strokes: [],
      };
      let currentStroke = null;
      let mode = "draw";
      let color = "#f3f1e8";
      let lineWidth = 8;
      let saveTimer = null;
      let saveInFlight = false;
      let saveAgain = false;
      let viewMode = readViewMode();

      function readViewMode() {
        try {
          return window.localStorage.getItem(viewModeStorageKey) === "fill"
            ? "fill"
            : "fit";
        } catch (_error) {
          return "fit";
        }
      }

      function updateViewModeButton() {
        const isFit = viewMode === "fit";
        viewModeButton.textContent = isFit ? copy.viewFit : copy.viewFill;
        viewModeButton.setAttribute("aria-pressed", String(isFit));
        const label = isFit ? copy.viewFitLabel : copy.viewFillLabel;
        viewModeButton.setAttribute("aria-label", label);
        viewModeButton.setAttribute("title", label);
      }

      function setViewMode(nextMode) {
        viewMode = nextMode === "fill" ? "fill" : "fit";
        try {
          window.localStorage.setItem(viewModeStorageKey, viewMode);
        } catch (_error) {
          // The preference remains active for this browser session.
        }
        updateViewModeButton();
        redraw();
      }

      function applyTranslations() {
        document.documentElement.lang = language;
        document.title = copy.pageTitle;
        document.querySelector("[data-i18n='title']").textContent = copy.title;
        document.querySelector("[data-i18n='subtitle']").textContent = copy.subtitle;
        document.getElementById("note-card").setAttribute("aria-label", copy.noteLabel);
        note.setAttribute("aria-label", copy.noteLabel);
        note.setAttribute("placeholder", copy.notePlaceholder);
        document.getElementById("board-shell").setAttribute("aria-label", copy.drawingArea);
        document.getElementById("toolbar").setAttribute("aria-label", copy.drawingTools);
        penTool.textContent = copy.chalk;
        eraserTool.textContent = copy.eraser;
        undoButton.textContent = copy.undo;
        undoButton.setAttribute("aria-label", copy.undoLabel);
        updateViewModeButton();
        clearButton.textContent = copy.clear;
        canvas.setAttribute("aria-label", copy.canvasLabel);
        emptyHint.textContent = copy.empty;
        document.getElementById("clear-title").textContent = copy.clearTitle;
        document.getElementById("clear-description").textContent = copy.clearDescription;
        cancelClear.textContent = copy.cancel;
        confirmClear.textContent = copy.confirm;
        colorButtons.forEach((button) => {
          button.setAttribute("aria-label", copy.colors[button.dataset.label]);
        });
        sizeButtons.forEach((button) => {
          button.setAttribute("aria-label", copy.sizes[button.dataset.label]);
        });
      }

      function setStatus(key, state = "ok") {
        status.textContent = copy[key] || key;
        status.dataset.state = state;
      }

      function normalizedPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
          y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)),
        };
      }

      function layoutDrawingSurface() {
        const rect = canvasWrap.getBoundingClientRect();
        let width = rect.width;
        let height = rect.height;
        let left = 0;
        let top = 0;
        const aspectRatio = board.canvas?.aspectRatio;

        if (
          viewMode === "fit" &&
          Number.isFinite(aspectRatio) &&
          aspectRatio > 0 &&
          rect.width > 0 &&
          rect.height > 0
        ) {
          if (rect.width / rect.height > aspectRatio) {
            width = rect.height * aspectRatio;
            left = (rect.width - width) / 2;
          } else {
            height = rect.width / aspectRatio;
            top = (rect.height - height) / 2;
          }
        }

        drawingSurface.style.left = `${left}px`;
        drawingSurface.style.top = `${top}px`;
        drawingSurface.style.width = `${Math.max(0, width)}px`;
        drawingSurface.style.height = `${Math.max(0, height)}px`;
      }

      function lockCanvasAspectRatio() {
        if (board.canvas?.aspectRatio) return;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        board.canvas = {
          aspectRatio: Math.round((rect.width / rect.height) * 10000) / 10000,
        };
      }

      function renderStroke(stroke) {
        const rect = canvas.getBoundingClientRect();
        if (!stroke.points?.length || !rect.width || !rect.height) return;

        context.save();
        context.globalCompositeOperation =
          stroke.mode === "erase" ? "destination-out" : "source-over";
        context.strokeStyle = stroke.color || "#f3f1e8";
        context.fillStyle = stroke.color || "#f3f1e8";
        context.lineWidth = stroke.width || 8;
        context.lineCap = "round";
        context.lineJoin = "round";

        const first = stroke.points[0];
        const firstX = first.x * rect.width;
        const firstY = first.y * rect.height;

        if (stroke.points.length === 1) {
          context.beginPath();
          context.arc(firstX, firstY, context.lineWidth / 2, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        context.beginPath();
        context.moveTo(firstX, firstY);
        for (let index = 1; index < stroke.points.length; index += 1) {
          const point = stroke.points[index];
          context.lineTo(point.x * rect.width, point.y * rect.height);
        }
        context.stroke();
        context.restore();
      }

      function redraw() {
        layoutDrawingSurface();
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        context.clearRect(0, 0, rect.width, rect.height);
        board.strokes.forEach(renderStroke);
        emptyHint.hidden = board.strokes.length > 0;
      }

      function drawLatestSegment(stroke) {
        if (stroke.points.length < 2) {
          renderStroke(stroke);
          return;
        }
        renderStroke({
          ...stroke,
          points: stroke.points.slice(-2),
        });
      }

      function scheduleSave() {
        setStatus("saving");
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveBoard, 450);
      }

      async function saveBoard() {
        window.clearTimeout(saveTimer);
        saveTimer = null;

        if (saveInFlight) {
          saveAgain = true;
          return;
        }

        saveInFlight = true;
        try {
          const response = await fetch("/api/state", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(board),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          setStatus("saved");
        } catch {
          setStatus("saveError", "error");
        } finally {
          saveInFlight = false;
          if (saveAgain) {
            saveAgain = false;
            saveBoard();
          }
        }
      }

      async function loadBoard() {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const loaded = await response.json();
          const candidateRatio = Number(loaded?.canvas?.aspectRatio);
          const aspectRatio =
            Number.isFinite(candidateRatio) &&
            candidateRatio >= minCanvasAspectRatio &&
            candidateRatio <= maxCanvasAspectRatio
              ? candidateRatio
              : null;
          board = {
            version: 2,
            note: typeof loaded.note === "string" ? loaded.note : "",
            canvas: { aspectRatio },
            strokes: Array.isArray(loaded.strokes) ? loaded.strokes : [],
          };
          note.value = board.note;
          redraw();
          setStatus("saved");
        } catch {
          redraw();
          setStatus("loadError", "error");
        }
      }

      function beginStroke(event) {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        event.preventDefault();
        lockCanvasAspectRatio();
        canvas.setPointerCapture(event.pointerId);
        currentStroke = {
          mode,
          color,
          width: mode === "erase" ? lineWidth * 2.6 : lineWidth,
          points: [normalizedPoint(event)],
        };
        board.strokes.push(currentStroke);
        drawLatestSegment(currentStroke);
        emptyHint.hidden = true;
      }

      function continueStroke(event) {
        if (!currentStroke || !canvas.hasPointerCapture(event.pointerId)) return;
        event.preventDefault();
        const events = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
        events.forEach((item) => {
          currentStroke.points.push(normalizedPoint(item));
          drawLatestSegment(currentStroke);
        });
      }

      function endStroke(event) {
        if (!currentStroke) return;
        event.preventDefault();
        if (canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
        currentStroke = null;
        scheduleSave();
      }

      function setMode(nextMode) {
        mode = nextMode;
        penTool.setAttribute("aria-pressed", String(mode === "draw"));
        eraserTool.setAttribute("aria-pressed", String(mode === "erase"));
      }

      penTool.addEventListener("click", () => setMode("draw"));
      eraserTool.addEventListener("click", () => setMode("erase"));

      colorButtons.forEach((button) => {
        button.addEventListener("click", () => {
          color = button.dataset.color;
          setMode("draw");
          colorButtons.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
        });
      });

      sizeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          lineWidth = Number(button.dataset.size);
          sizeButtons.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
        });
      });

      undoButton.addEventListener("click", () => {
        if (!board.strokes.length) return;
        board.strokes.pop();
        redraw();
        scheduleSave();
      });

      viewModeButton.addEventListener("click", () => {
        setViewMode(viewMode === "fit" ? "fill" : "fit");
      });

      clearButton.addEventListener("click", () => clearDialog.showModal());
      cancelClear.addEventListener("click", () => clearDialog.close());
      confirmClear.addEventListener("click", () => {
        board.note = "";
        board.canvas = { aspectRatio: null };
        board.strokes = [];
        note.value = "";
        redraw();
        clearDialog.close();
        scheduleSave();
      });

      note.addEventListener("input", () => {
        board.note = note.value;
        scheduleSave();
      });

      canvas.addEventListener("pointerdown", beginStroke);
      canvas.addEventListener("pointermove", continueStroke);
      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointercancel", endStroke);

      new ResizeObserver(redraw).observe(canvasWrap);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden" && saveTimer) saveBoard();
      });

      applyTranslations();
      setStatus("loading");
      loadBoard();
    </script>
  </body>
</html>
